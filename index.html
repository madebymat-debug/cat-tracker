<style>
:root{
  --ink:#141B33; --deep:#0D1224; --panel:#1C2442; --line:#2B3459;
  --moon:#ECE8F4; --muted:#949AB8; --eye:#F2B53A; --eye-soft:rgba(242,181,58,.16);
  --grass:#7FC8A0; --dusk:#6E7BD6;
  --f:"Bricolage Grotesque",ui-rounded,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--deep);color:var(--moon);font-family:var(--f);-webkit-text-size-adjust:100%}
body{overscroll-behavior:none;position:fixed;inset:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,label:focus-visible{outline:2px solid var(--eye);outline-offset:2px}

#mapwrap{position:fixed;inset:0;z-index:1}
#map{position:absolute;inset:0;background:#0b1020}
.leaflet-container{font-family:var(--f)}
.leaflet-control-attribution{background:rgba(13,18,36,.7)!important;color:var(--muted)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--muted)!important}
.top{position:absolute;z-index:500;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 26px;
  background:linear-gradient(rgba(13,18,36,.88),rgba(13,18,36,0));display:flex;align-items:center;gap:10px;pointer-events:none}
.top>*{pointer-events:auto}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;background:rgba(20,27,51,.82);border:1px solid var(--line);border-radius:999px;padding:3px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:999px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--eye);color:var(--deep)}
.above{position:absolute;left:12px;right:12px;bottom:100%;padding-bottom:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none;transition:opacity .2s}
.above>*{pointer-events:auto}
#sheet[data-s=full] .above{opacity:0}
#sheet[data-s=full] .above>*{pointer-events:none}
.mapctl{display:flex;justify-content:space-between;gap:8px}
.layers button{padding:6px 10px}
.base button{padding:6px 10px}
.trip-banner{background:rgba(20,27,51,.92);border:1px solid var(--eye);
  border-radius:14px;padding:10px 12px;display:none;align-items:center;gap:10px;font-size:14px}
.trip-banner.on{display:flex}
.trip-banner span{flex:1}
.trip-banner button{border:0;background:var(--eye);color:var(--deep);font-weight:700;border-radius:999px;padding:6px 12px}

#sheet{position:fixed;z-index:2;left:0;right:0;bottom:0;height:calc(100svh - env(safe-area-inset-top,0px) - 60px);display:flex;flex-direction:column;
  background:var(--ink);border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.35);transform:translateY(100%);
  transition:transform .34s cubic-bezier(.2,.85,.25,1);will-change:transform}
#sheet.dragging{transition:none}
.head{flex:none;padding:10px 0 12px;touch-action:none;cursor:grab;border:0;background:none;width:100%}
.grab{width:40px;height:5px;border-radius:3px;background:#3A4470;margin:0 auto}
#scroller{flex:1;min-height:0;overflow-y:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:4px 18px calc(env(safe-area-inset-bottom,0px) + 40px)}
#sheet[data-s=full] #scroller{overflow-y:auto}
.lede{font-size:21px;line-height:1.35;font-weight:400;margin:0 0 20px;max-width:34ch}
.lede b{font-weight:800;color:var(--eye)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:30px}
.stat{background:var(--ink);padding:12px 14px}
.stat .v{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat .k{font-size:13px;color:var(--muted)}
h2{font-size:17px;font-weight:800;margin:0 0 4px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px;line-height:1.4}
section{margin-bottom:34px}
.clockrow{display:flex;justify-content:center}
#clock{width:min(300px,82vw);height:auto}
.spot{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:11px 0;border-top:1px solid var(--line)}
.spot:last-child{border-bottom:1px solid var(--line)}
.spot .n{width:28px;height:28px;flex:none;border-radius:50%;background:var(--grass);color:var(--deep);font-weight:800;display:grid;place-items:center;font-size:14px}
.spot .t{flex:1;min-width:0}
.spot .t b{display:block;font-size:15px}
.spot .t small{color:var(--muted);font-size:13px}
.spot .bar{width:64px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;flex:none}
.spot .bar i{display:block;height:100%;background:var(--grass)}
#days{width:100%;height:120px;display:block}
.cmp{display:flex;gap:18px;align-items:center}
#compass{width:132px;height:132px;flex:none}
.cmp p{margin:0;font-size:15px;line-height:1.45}
.trip{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.trip .when{flex:1}
.trip .when small{display:block;color:var(--muted);font-size:13px}
.trip .dur{font-weight:700;color:var(--eye);display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.trip .dur svg{width:15px;height:15px;flex:none}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.filters label:last-child:nth-child(odd){grid-column:1/-1}
.filters label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.filters select{font:inherit;font-size:15px;color:var(--moon);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 10px;-webkit-appearance:none;appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,#949AB8 50%),linear-gradient(135deg,#949AB8 50%,transparent 50%);background-position:calc(100% - 15px) 55%,calc(100% - 10px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.trip .tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tag{font-size:12px;border-radius:999px;padding:1px 8px;background:#26304F;color:var(--moon)}
.tag.new{background:rgba(127,200,160,.18);color:var(--grass)}
.tag.wx{color:#B9C4E8}
.wxg{margin-bottom:16px}
.wxg h3{font-size:14px;font-weight:600;color:var(--muted);margin:0 0 6px}
.wxrow{display:grid;grid-template-columns:118px 1fr 58px;align-items:center;gap:10px;font-size:14px;padding:4px 0}
.wxrow small{color:var(--muted)}
.wxrow .b{height:10px;border-radius:5px;background:#232C4D;overflow:hidden}
.wxrow .b i{display:block;height:100%;background:#8FB6F0;border-radius:5px}
.wxrow .v{text-align:right;font-weight:700}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
#routine{width:100%;height:auto;display:block}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.cal .mo{grid-column:1/-1;font-size:14px;font-weight:700;margin:12px 0 4px}
.cal .mo:first-child{margin-top:0}
.cal button,.cal .x{position:relative;aspect-ratio:1;border:0;border-radius:7px;font-size:11px;padding:0;color:var(--moon);background:#1F2747;display:flex;align-items:flex-start;justify-content:flex-start}
.cal button span{padding:4px 0 0 5px;opacity:.8}
.cal button.hot{color:var(--deep);font-weight:700}
.cal .x{background:none}
.cal .rain{position:absolute;right:4px;bottom:4px;width:6px;height:6px;border-radius:50%;background:#8FB6F0;box-shadow:0 0 0 1.5px var(--ink)}
.callegend{display:flex;align-items:center;gap:12px;font-size:12px;color:var(--muted);margin-top:10px;flex-wrap:wrap}
.callegend i{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.tripbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px;font-size:14px;color:var(--muted)}
.tripbar button{border:1px solid var(--eye);background:none;color:var(--eye);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13px}
.more{border:1px solid var(--line);background:none;border-radius:999px;padding:8px 14px;font-size:14px;margin-top:10px;color:var(--muted)}
.card{background:var(--panel);border-radius:16px;padding:16px;margin-bottom:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:999px;padding:11px 18px;font-weight:700;font-size:15px;background:var(--eye);color:var(--deep)}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--moon)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:inherit;font-size:16px;color:var(--moon);background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
.msg{font-size:14px;color:var(--muted);margin:10px 0 0;line-height:1.4}
.msg.err{color:#FF9C8A}
.code{font-size:20px;font-weight:800;letter-spacing:.06em;color:var(--eye)}
.empty{padding:28px 0 10px}
.empty h2{font-size:26px;margin-bottom:8px}
.empty p{color:var(--muted);line-height:1.5;margin:0 0 18px;max-width:36ch}
.hide{display:none!important}
.spotpin{background:var(--grass);color:var(--deep);border:2px solid #0D1224;border-radius:50%;font:800 13px var(--f);display:grid;place-items:center}
.homepin{background:var(--eye);border:3px solid #0D1224;border-radius:50%;box-shadow:0 0 0 6px var(--eye-soft)}
.catdot{background:var(--eye);border:2px solid #fff;border-radius:50%;box-shadow:0 0 12px var(--eye)}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}#sheet{transition:none}}
</style>
</head>
<body>
<div id="mapwrap">
  <div id="map" role="region" aria-label="Map"></div>
  <div class="top">
    <h1 id="title">Cat tracks</h1>
    <div class="seg" id="range" role="group" aria-label="Date range">
      <button data-r="7">7 days</button><button data-r="30">30 days</button><button data-r="0">All</button>
    </div>
  </div>
</div>

<main id="sheet" data-s="peek">
  <div class="above">
    <div class="trip-banner" id="tripBanner"><span id="tripText"></span><button id="tripClose">Show all</button></div>
    <div class="mapctl">
      <div class="seg layers" id="layers" role="group" aria-label="Map layers">
        <button data-l="routes">Routes</button><button data-l="heat">Heat</button><button data-l="spots">Spots</button><button data-l="range">Range</button>
      </div>
      <div class="seg base" id="base" role="group" aria-label="Base map">
        <button data-b="sat">Satellite</button><button data-b="map">Map</button>
      </div>
    </div>
  </div>
  <button class="head" id="head" aria-label="Expand or collapse details"><div class="grab"></div></button>
  <div id="scroller">
  <div id="content"></div>

  <section id="settings">
    <h2>Data</h2>
    <p class="sub" id="dataInfo"></p>
    <div class="card">
      <div class="row">
        <label class="btn" for="file">Import GPX</label>
        <input type="file" id="file" accept=".gpx,application/gpx+xml,application/xml,text/xml" multiple class="hide">
      </div>
      <p class="msg" id="importMsg">Export GPX from Tractive and import it here. New files merge with what's already saved, so overlapping exports are fine.</p>
    </div>
    <div class="card">
      <label for="catName" class="sub" style="display:block;margin-bottom:6px">Cat's name</label>
      <input type="text" id="catName" autocomplete="off" maxlength="30" placeholder="e.g. Pepper">
    </div>
    <div class="card" id="syncCard"></div>
  </section>
  </div>
</main>

<script>
"use strict";
// ---------- Config ----------
const SB_URL="https://auxgkypuiiqvujbacbvy.supabase.co";
const SB_KEY="sb_publishable_NmopGRSY8WU82P_ciex-_g_lO0aD2LQ";
const TZ="Europe/London";
const $=s=>document.querySelector(s);

// ---------- State ----------
const LS="cattracks.v1";
let S={pts:[],name:"",code:"",lastSync:0,range:30,tf:{sort:"new",dur:0,far:0,tod:"any",wx:"any",show:"all"},layers:{routes:true,heat:false,spots:true,range:false},base:"sat"};
try{Object.assign(S,JSON.parse(localStorage.getItem(LS)||"{}"))}catch(e){}
S.tf=Object.assign({sort:"new",dur:0,far:0,tod:"any",wx:"any",show:"all"},S.tf);
function save(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}

// ---------- Weather (Open-Meteo, cached on this phone) ----------
const WXL="cattracks.wx";
let WX={h:{},at:0,tried:0}, wxState="idle";
try{Object.assign(WX,JSON.parse(localStorage.getItem(WXL)||"{}"))}catch(e){}
const wxAt=t=>WX.h[Math.floor(t/3600)*3600]||null; // [tempC, rain mm in hour, wind mph]
async function fetchWeather(){
  if(!S.pts.length||wxState==="loading") return; const home=findHome(S.pts); if(!home) return;
  const first=S.pts[0][0], last=S.pts[S.pts.length-1][0], nowS=Date.now()/1000;
  let missing=false; for(let t=Math.ceil(first/3600)*3600;t<=last-3600;t+=3600) if(!WX.h[t]){missing=true;break}
  if(!missing) return;
  if(WX.tried===last&&Date.now()-WX.at<30*60*1000) return;
  wxState="loading";
  const base=`latitude=${home[1].toFixed(3)}&longitude=${home[2].toFixed(3)}&hourly=temperature_2m,precipitation,wind_speed_10m&wind_speed_unit=mph&timeformat=unixtime&timezone=GMT`;
  const ymd=t=>new Date(t*1000).toISOString().slice(0,10), reqs=[];
  if(first<nowS-85*86400) reqs.push(`https://archive-api.open-meteo.com/v1/archive?${base}&start_date=${ymd(first-86400)}&end_date=${ymd(Math.min(last,nowS-6*86400))}`);
  if(last>nowS-90*86400) reqs.push(`https://api.open-meteo.com/v1/forecast?${base}&past_days=92&forecast_days=1`);
  try{
    for(const u of reqs){const r=await fetch(u); if(!r.ok) throw new Error(r.status); const H=(await r.json()).hourly;
      H.time.forEach((t,i)=>{if(H.temperature_2m[i]==null||t>nowS) return; WX.h[t]=[H.temperature_2m[i],H.precipitation[i]||0,H.wind_speed_10m[i]||0].map(x=>Math.round(x*10)/10)})}
    wxState="ok";
  }catch(e){wxState="error"}
  WX.at=Date.now(); WX.tried=last; try{localStorage.setItem(WXL,JSON.stringify(WX))}catch(e){}
  render();
}
function tripWx(t){let n=0,temp=0,rain=0,wind=0;
  for(let h=Math.floor(t.start/3600)*3600;h<=t.end;h+=3600){const w=wxAt(h);if(!w) continue;n++;temp+=w[0];rain+=w[1];wind=Math.max(wind,w[2])}
  return n?{temp:temp/n,rain,wind}:null}
function wxLabel(w){const r=w.rain>=2?"heavy rain":w.rain>=0.5?"rain":w.rain>=0.1?"light rain":"dry";
  return `${Math.round(w.temp)}°C, ${r}${w.wind>=18?", windy":w.wind>=10?", breezy":""}`}

// ---------- Geo helpers ----------
const R=6371000, rad=d=>d*Math.PI/180;
function dist(a,b){const dLa=rad(b[1]-a[1]),dLo=rad(b[2]-a[2]);const x=Math.sin(dLa/2)**2+Math.cos(rad(a[1]))*Math.cos(rad(b[1]))*Math.sin(dLo/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
const d2=(la1,lo1,la2,lo2)=>dist([0,la1,lo1],[0,la2,lo2]);
function bearing(a,b){const y=Math.sin(rad(b[2]-a[2]))*Math.cos(rad(b[1]));const x=Math.cos(rad(a[1]))*Math.sin(rad(b[1]))-Math.sin(rad(a[1]))*Math.cos(rad(b[1]))*Math.cos(rad(b[2]-a[2]));return (Math.atan2(y,x)*180/Math.PI+360)%360}

// ---------- Time helpers (UK time) ----------
const fmtParts=new Intl.DateTimeFormat("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit",hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit"});
const hmCache=new Map();
function local(t){ // t in seconds -> {day:"YYYY-MM-DD", h, m}
  const k=Math.floor(t/60); let v=hmCache.get(k); if(v) return v;
  const p={}; for(const x of fmtParts.formatToParts(new Date(t*1000))) p[x.type]=x.value;
  v={day:`${p.year}-${p.month}-${p.day}`,h:+p.hour,m:+p.minute}; if(hmCache.size>50000) hmCache.clear(); hmCache.set(k,v); return v;
}
const fmtTime=t=>new Date(t*1000).toLocaleTimeString("en-GB",{timeZone:TZ,hour:"2-digit",minute:"2-digit"});
const fmtDay=t=>new Date(t*1000).toLocaleDateString("en-GB",{timeZone:TZ,weekday:"short",day:"numeric",month:"short"});
const clock=h=>{const hh=((h%24)+24)%24;const H=Math.floor(hh),M=Math.round((hh-H)*60);const d=new Date(2000,0,1,H,M);return d.toLocaleTimeString("en-GB",{hour:"numeric",minute:"2-digit",hour12:true}).replace(":00","").replace(" ","")};
function dur(s){s=Math.round(s/60);if(s<60) return s+"m";const h=Math.floor(s/60),m=s%60;return h+"h"+(m?" "+m+"m":"")}
function durLong(s){s=Math.round(s/60);if(s<60) return s+" min";const h=Math.floor(s/60),m=s%60;return h+" hr"+(h>1?"s":"")+(m?" "+m+" min":"")}
const metres=m=>m>=1000?(m/1000).toFixed(1)+" km":Math.round(m)+" m";

// Sunrise/sunset (NOAA approximation), returns UK local decimal hours
function sunTimes(dateSec,lat,lon){
  const d=new Date(dateSec*1000), J=d/86400000+2440587.5, n=Math.round(J-2451545+0.0008);
  const Js=n-lon/360, M=(357.5291+0.98560028*Js)%360, C=1.9148*Math.sin(rad(M))+0.02*Math.sin(rad(2*M))+0.0003*Math.sin(rad(3*M));
  const L=(M+C+180+102.9372)%360, Jt=2451545+Js+0.0053*Math.sin(rad(M))-0.0069*Math.sin(rad(2*L));
  const dec=Math.asin(Math.sin(rad(L))*Math.sin(rad(23.44)));
  const w=Math.acos((Math.sin(rad(-0.83))-Math.sin(rad(lat))*Math.sin(dec))/(Math.cos(rad(lat))*Math.cos(dec)))*180/Math.PI;
  const toLocal=j=>{const t=(j-2440587.5)*86400;const l=local(t);return l.h+l.m/60};
  return {rise:toLocal(Jt-w/360),set:toLocal(Jt+w/360)};
}

// ---------- GPX parsing ----------
function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,"application/xml");
  if(doc.querySelector("parsererror")) throw new Error("That file isn't valid GPX");
  const out=[];
  for(const p of doc.getElementsByTagName("trkpt")){
    const lat=+p.getAttribute("lat"), lon=+p.getAttribute("lon");
    const tn=p.getElementsByTagName("time")[0]; if(!tn||!isFinite(lat)||!isFinite(lon)) continue;
    const t=Math.round(Date.parse(tn.textContent.trim())/1000); if(!isFinite(t)) continue;
    const c=p.getElementsByTagName("cmt")[0]; const m=c&&/speed:\s*([\d.]+)/.exec(c.textContent);
    out.push([t,+lat.toFixed(6),+lon.toFixed(6),m?+m[1]:null]);
  }
  return out;
}
function mergePts(a,b){const m=new Map();for(const p of a) m.set(p[0],p);for(const p of b) m.set(p[0],p);return [...m.values()].sort((x,y)=>x[0]-y[0])}

// ---------- Analysis ----------
function findHome(pts){ // Tractive snaps to one fixed coordinate while in the home zone
  const c=new Map(); let best=null,bn=0;
  for(const p of pts){if(p[3]!==null) continue;const k=p[1]+","+p[2];const n=(c.get(k)||0)+1;c.set(k,n);if(n>bn){bn=n;best=p}}
  return best?[0,best[1],best[2]]:null;
}
function analyse(all,rangeDays){
  const home=findHome(all); if(!home) return null;
  const isHome=p=>p[1]===home[1]&&p[2]===home[2];
  const now=all.length?all[all.length-1][0]:Date.now()/1000;
  const from=rangeDays?now-rangeDays*86400:-Infinity;

  // Trips: runs of away-from-home points
  let trips=[],cur=null;

  const dry=rows[0][1].find(b=>b.l==="Dry"), wetN=E.filter(e=>e.rain>=0.2), wet=wetN.length?wetN.reduce((s,e)=>s+e.out,0)/wetN.length:0;

  rows.forEach(([t,bs])=>{h+=`<div class="wxg"><h3>${t}</h3>`;bs.forEach(b=>{h+=`<div class="wxrow"><span>${b.l} <small>(${b.n})</small></span><span class="b"><i style="width:${Math.round(b.v/max*100)}%"></i></span><span class="v">${dur(b.v)}</span></div>`});h+=`</div>`});
  if(E.length<30) h+=`<p class="note">Numbers in brackets are nights. With this few, treat the patterns as early signs; they'll firm up as more weather builds up.</p>`;

let syncState="idle",syncErr="";
async function rpc(fn,body){
  const r=await fetch(SB_URL+"/rest/v1/rpc/"+fn,{method:"POST",headers:{"apikey":SB_KEY,"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok){let d="";try{d=(await r.json()).code||""}catch(e){} throw new Error(r.status+(d?" "+d:""))}
  const t=await r.text(); return t?JSON.parse(t):null;
}
async function syncNow(){
  if(!S.code) return;
  syncState="syncing"; renderSync();
  try{
    const remote=await rpc("get_cat",{p_code:S.code})||{};
    const before=S.pts.length;
    S.pts=mergePts(remote.pts||[],S.pts);
    if(!S.name&&remote.name) S.name=remote.name;
    await rpc("save_cat",{p_code:S.code,p_data:{name:S.name,pts:S.pts}});
    S.lastSync=Date.now(); save(); syncState="ok";
    if(S.pts.length!==before) {render();fetchWeather();return}

}

const SH=$("#sheet"), SC=$("#scroller");
let snap="peek", curY=0;
function peekH(){const f=$("#content").firstElementChild;const head=$("#head").offsetHeight;
  const h=f?(f.classList.contains("empty")?f.offsetHeight:f.offsetHeight+24):120;return Math.max(110,Math.min(320,head+h))}
function snaps(){const h=SH.offsetHeight;return {full:0,half:Math.max(0,h-innerHeight*.52),peek:Math.max(0,h-peekH())}}
function place(y){curY=y;SH.style.transform=`translateY(${y}px)`}
function setSnap(s){snap=s;SH.dataset.s=s;if(s!=="full") SC.scrollTop=0;place(snaps()[s])}
function visibleSheet(){return SH.offsetHeight-curY}
function mapPad(){return {maxZoom:19,paddingTopLeft:[16,70],paddingBottomRight:[16,visibleSheet()+64]}}
(function(){
  const order=["peek","half","full"];
  let startY=0,startOff=0,lastY=0,lastT=0,vel=0,mode=null;
  const nearest=()=>{const P=snaps();return order.reduce((a,k)=>Math.abs(P[k]-curY)<Math.abs(P[a]-curY)?k:a,"peek")};
  SH.addEventListener("touchstart",e=>{
    if(e.target.closest(".above")){mode=null;return}
    const y=e.touches[0].clientY; startY=lastY=y; startOff=curY; lastT=performance.now(); vel=0;
    mode=(snap!=="full"||e.target.closest("#head"))?"pending":(SC.scrollTop<=0?"maybe":null);
  },{passive:true});
  SH.addEventListener("touchmove",e=>{
    if(!mode) return;
    const y=e.touches[0].clientY, dy=y-startY;
    if(mode==="maybe"){ if(dy>6&&SC.scrollTop<=0){mode="drag";startY=y;startOff=curY} else if(Math.abs(dy)>6){mode=null;return} else return }
    if(mode==="pending"){ if(Math.abs(dy)<6) return; mode="drag"; startY=y }
    e.preventDefault(); SH.classList.add("dragging");
    const now=performance.now(); vel=(y-lastY)/Math.max(1,now-lastT); lastY=y; lastT=now;
    const max=SH.offsetHeight-90; let ny=startOff+(y-startY);
    if(ny<0) ny=ny/3; if(ny>max) ny=max+(ny-max)/3; place(ny);
  },{passive:false});
  const end=()=>{
    if(mode!=="drag"){mode=null;return} mode=null; SH.classList.remove("dragging");
    let i=order.indexOf(nearest());
    if(vel>.45&&order[i]===snap) i--; else if(vel<-.45&&order[i]===snap) i++;
    if(vel>.45) i=Math.min(i,order.indexOf(snap)-1); if(vel<-.45) i=Math.max(i,order.indexOf(snap)+1);
    setSnap(order[Math.max(0,Math.min(2,i))]);
  };
  SH.addEventListener("touchend",end); SH.addEventListener("touchcancel",end);
  $("#head").addEventListener("click",()=>setSnap(snap==="peek"?"half":snap==="half"?"full":"peek"));
  addEventListener("resize",()=>setSnap(snap));
})();
